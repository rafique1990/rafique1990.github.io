---
layout: default
---
<article>
    <header class="post-head">
        <span class="kicker">{{ page.categories | join: " · " }}</span>
        <h1>{{ page.title }}</h1>
        <div class="post-meta">{{ page.date | date: "%B %-d, %Y" }} · {{ content | number_of_words | divided_by: 200 | plus: 1 }} min read</div>
        {% if page.tags %}
        <div class="tags">
            {% for t in page.tags %}<span class="tag">{{ t }}</span>{% endfor %}
        </div>
        {% endif %}
    </header>

    <div class="prose">
        {{ content }}
    </div>

    <a class="backlink" href="/blog/">&larr; All posts</a>
</article>
