<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} · {% endif %}Rafique Nazir</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23C4562F'/%3E%3Cstop offset='.5' stop-color='%23A65CC4'/%3E%3Cstop offset='1' stop-color='%235B7CFA'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%23FBFAF8'/%3E%3Crect x='6' y='6' width='52' height='52' rx='12' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='Inter,Arial,sans-serif' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3ERN%3C/text%3E%3C/svg%3E">
    <style>
        :root{
            --bg:#FBFAF8; --bg-2:#F4F1EB; --surface:#FFFFFF; --line:#E7E2D8;
            --ink:#17160F; --ink-2:#45433B; --ink-3:#6A675E;
            --clay:#C4562F; --clay-ink:#A2431F; --violet:#7C3AED;
            --grad:linear-gradient(100deg,#C4562F 0%,#D97757 30%,#A65CC4 65%,#5B7CFA 100%);
            --disp:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            --mono:'Roboto Mono',ui-monospace,Menlo,monospace;
        }
        *{box-sizing:border-box;margin:0;padding:0;}
        html{scroll-behavior:smooth;}
        body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.75;-webkit-font-smoothing:antialiased;}
        a{color:var(--clay-ink);}
        .topbar{height:4px;background:var(--grad);}
        .nav{max-width:820px;margin:0 auto;padding:1.4rem 1.5rem;display:flex;justify-content:space-between;align-items:center;}
        .brand{display:inline-flex;align-items:center;gap:0.6rem;font-family:var(--disp);font-weight:700;font-size:1.1rem;color:var(--ink);text-decoration:none;}
        .brand .mark{width:30px;height:30px;border-radius:9px;background:var(--grad);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:0.9rem;}
        .nav-links a{font-family:var(--disp);font-weight:600;font-size:0.95rem;color:var(--ink-2);text-decoration:none;margin-left:1.2rem;}
        .nav-links a:hover{color:var(--clay-ink);}
        .wrap{max-width:820px;margin:0 auto;padding:2rem 1.5rem 4rem;}
        .post-head{margin:1.5rem 0 2.2rem;}
        .post-head .kicker{font-family:var(--disp);font-size:0.78rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--clay-ink);}
        .post-head h1{font-family:var(--disp);font-weight:700;font-size:clamp(2rem,5vw,2.9rem);line-height:1.1;letter-spacing:-0.025em;margin:0.6rem 0 0.7rem;}
        .post-meta{font-family:var(--mono);font-size:0.85rem;color:var(--ink-3);}
        .tags{margin-top:0.8rem;display:flex;flex-wrap:wrap;gap:0.4rem;}
        .tag{font-family:var(--mono);font-size:0.74rem;color:var(--ink-2);background:var(--bg-2);border:1px solid var(--line);border-radius:7px;padding:0.24rem 0.6rem;}
        /* prose */
        .prose h2{font-family:var(--disp);font-weight:700;font-size:1.6rem;letter-spacing:-0.02em;margin:2.4rem 0 0.9rem;}
        .prose h3{font-family:var(--disp);font-weight:600;font-size:1.25rem;margin:1.8rem 0 0.7rem;}
        .prose p{margin:0 0 1.15rem;color:var(--ink-2);}
        .prose strong{color:var(--ink);font-weight:700;}
        .prose ul,.prose ol{margin:0 0 1.15rem 1.4rem;color:var(--ink-2);}
        .prose li{margin-bottom:0.4rem;}
        .prose a{text-decoration:underline;text-underline-offset:2px;}
        .prose blockquote{border-left:3px solid var(--clay);background:var(--bg-2);padding:0.8rem 1.2rem;border-radius:0 10px 10px 0;margin:0 0 1.15rem;color:var(--ink-2);}
        .prose code{font-family:var(--mono);font-size:0.88em;background:var(--bg-2);border:1px solid var(--line);border-radius:5px;padding:0.1em 0.35em;}
        .prose pre{background:#1b1a16;color:#f4f1ea;border-radius:12px;padding:1.2rem 1.3rem;overflow-x:auto;margin:0 0 1.4rem;font-size:0.86rem;line-height:1.55;}
        .prose pre code{background:none;border:none;padding:0;color:inherit;font-size:0.86rem;}
        .prose .highlight{border-radius:12px;overflow:hidden;margin:0 0 1.4rem;}
        .prose table{width:100%;border-collapse:collapse;margin:0 0 1.4rem;font-size:0.94rem;}
        .prose th,.prose td{border:1px solid var(--line);padding:0.5rem 0.8rem;text-align:left;}
        .prose th{background:var(--bg-2);font-weight:700;}
        .mermaid{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.4rem;margin:0 0 1.6rem;text-align:center;}
        .post-list{list-style:none;margin:1.5rem 0 0;}
        .post-list li{border-top:1px solid var(--line);padding:1.5rem 0;}
        .post-list a.title{font-family:var(--disp);font-weight:600;font-size:1.35rem;color:var(--ink);text-decoration:none;letter-spacing:-0.02em;}
        .post-list a.title:hover{color:var(--clay-ink);}
        .post-list .excerpt{color:var(--ink-2);margin:0.4rem 0 0;}
        .backlink{display:inline-flex;align-items:center;gap:0.4rem;font-family:var(--disp);font-weight:600;font-size:0.92rem;color:var(--clay-ink);text-decoration:none;margin-top:2.5rem;}
        .backlink:hover{text-decoration:underline;}
        footer{border-top:1px solid var(--line);margin-top:3rem;}
        .foot{max-width:820px;margin:0 auto;padding:2rem 1.5rem;font-family:var(--mono);font-size:0.82rem;color:var(--ink-3);text-align:center;}
        @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
    </style>
</head>
<body>
    <div class="topbar"></div>
    <nav class="nav">
        <a href="/" class="brand"><span class="mark">RN</span>Rafique Nazir</a>
        <div class="nav-links">
            <a href="/">Portfolio</a>
            <a href="/blog/">Blog</a>
        </div>
    </nav>

    <main class="wrap">
        {{ content }}
    </main>

    <footer>
        <div class="foot">Rafique Nazir · AI Engineer · <a href="https://rafiquenazir.de">rafiquenazir.de</a></div>
    </footer>

    <!-- Mermaid.js: auto-render ```mermaid fenced blocks as SVG -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        document.querySelectorAll('.language-mermaid').forEach(function (block) {
            var pre = document.createElement('pre');
            pre.className = 'mermaid';
            pre.textContent = block.textContent;
            block.replaceWith(pre);
        });
        if (document.querySelector('.mermaid')) {
            mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict' });
            await mermaid.run();
        }
    </script>
</body>
</html>
